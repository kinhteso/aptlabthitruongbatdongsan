sites:
  topcv:
    site_label: Batdongsan.com.vn (PropertyGuru VN)
    portal_alias: batdongsan
    enabled: true
    engine: playwright_stealth
    base_url: https://www.topcv.vn
    real_estate_domain: https://batdongsan.com.vn
    search_url_template: https://www.topcv.vn/tim-viec-lam-{keyword_slug}?l={topcv_id}&page={page}
    prefer_json_ld: true
    selectors:
      job_cards: div.job-item-search-result, div.job-item-2, div.js__card
      job_link: h3.title a, a.js__product-link-for-product-id
      salary_badge: label.title-salary, span.salary, span.re__card-config-price
      location_badge: label.address, span.address, div.re__card-location
      skill_tags: div.job-tags a, span.tag-item, span.re__card-config-dot
  itviec:
    site_label: Nha.Chotot.com (Chợ Tốt Nhà)
    portal_alias: chotot
    enabled: true
    engine: playwright_stealth
    base_url: https://itviec.com
    real_estate_domain: https://nha.chotot.com
    search_url_template: https://itviec.com/it-jobs/{keyword_slug}/{itviec_slug}?page={page}
    prefer_json_ld: true
    selectors:
      job_cards: div.job-card, div[data-search--job-selection-job-slug-value], li.AdItem_wrapper,
        a[href*='viec-lam'], a[href*='it-jobs'], a[href*='tim-viec-lam'], a[href*='-jd']
      job_link: h3 a, a.AdItem_adItem
      salary_badge: div.salary, span.ips-2, p.AdBody_price
      skill_tags: a.itag, span.AdBody_spec
      work_mode_badge: span.work-mode
  careerviet:
    site_label: Alonhadat.com.vn (Alo Nhà Đất)
    portal_alias: alonhadat
    enabled: true
    engine: httpx_or_playwright
    base_url: https://careerviet.vn
    real_estate_domain: https://alonhadat.com.vn
    search_url_template: https://careerviet.vn/viec-lam/{keyword_slug}-k-trang-{page}-vi.html
    prefer_json_ld: true
    selectors:
      job_cards: div.job-item, div.content-item
      job_link: div.title h2 a, div.ct_title a
      salary_badge: div.salary p, div.ct_price
      location_badge: div.location ul li, div.ct_dis
      skill_tags: div.job-tags ul li a, span.ct_dt
  vietnamworks:
    site_label: Mogi.vn (Mogi Real Estate)
    portal_alias: mogi
    enabled: true
    engine: playwright_or_api
    base_url: https://www.vietnamworks.com
    real_estate_domain: https://mogi.vn
    search_url_template: https://www.vietnamworks.com/viec-lam?q={keyword_encoded}&l={vnworks_id}&page={page}
    prefer_json_ld: true
    selectors:
      job_cards: div.search_list, div.view_job_item, ul.props li
      job_link: a.img_job_card, h2 a, a.link-overlay
      salary_badge: span.salary, div.price
      skill_tags: a.skill-tag, ul.prop-attr li
