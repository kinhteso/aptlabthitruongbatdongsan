# ==============================================================================
# DOCKER COMPOSE "PULL-ONCE ALL-IN-ONE" CHO UBUNTU SERVER (TỪ GHCR)
# Repository : https://github.com/kinhteso/aptlabthitruongbatdongsan
# GHCR Images:
#   1. ghcr.io/kinhteso/aptlabthitruongbatdongsan:latest (Scraper + ETL + ML + FastAPI + RBAC + MCP)
#   2. ghcr.io/kinhteso/aptlabthitruongbatdongsan-webapp:latest (Next.js 15 Port 3359 + Google OAuth + Password Auth + PWA)
# CƠ CHẾ LƯU DỮ LIỆU RA Ổ CỨNG (HOST BIND MOUNTS 100%):
#   - Toàn bộ dữ liệu PostgreSQL, Redis AOF, Medallion (Bronze/Silver/Gold) và Logs được
#     ánh xạ trực tiếp ra ổ cứng máy chủ Ubuntu thông qua biến `HOST_DATA_ROOT` (mặc định: `../../data`).
# ==============================================================================
name: propvalue-ubuntu-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: propvalue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillvalue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillvalue_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_market}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${HOST_DATA_ROOT:-../../data}/postgres:/var/lib/postgresql/data
      - ../../infra/postgres/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillvalue} -d ${POSTGRES_DB:-real_estate_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propvalue_net

  redis:
    image: redis:7-alpine
    container_name: propvalue_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${HOST_DATA_ROOT:-../../data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propvalue_net

  api:
    image: ghcr.io/kinhteso/aptlabthitruongbatdongsan:latest
    container_name: propvalue_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillvalue}:${POSTGRES_PASSWORD:-skillvalue_secret_2026}@postgres:5432/${POSTGRES_DB:-real_estate_market}
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-phungtuananh3333@gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-phungtuananh3333@gmail.com,phungtuananh2222@gmail.com}
      TZ: Asia/Ho_Chi_Minh
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../configs:/app/configs
      - ${HOST_DATA_ROOT:-../../data}:/app/data
      - ../../docs:/app/docs
      - ${HOST_LOGS_ROOT:-../../logs}:/app/logs
    networks:
      - propvalue_net

  webapp:
    image: ghcr.io/kinhteso/aptlabthitruongbatdongsan-webapp:latest
    container_name: propvalue_webapp_pwa
    restart: unless-stopped
    environment:
      PORT: "3359"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3359}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3359}
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      INTERNAL_API_URL: http://api:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-647264796658-h96idjs8hohr4hf8pjid8i531lqr2gra.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-phungtuananh3333@gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-phungtuananh3333@gmail.com,phungtuananh2222@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-skillvalue_secret_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${WEBAPP_PORT:-3359}:3359"
    depends_on:
      - api
    networks:
      - propvalue_net

  scraper-etl:
    image: ghcr.io/kinhteso/aptlabthitruongbatdongsan:latest
    container_name: propvalue_scraper_etl
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillvalue}:${POSTGRES_PASSWORD:-skillvalue_secret_2026}@postgres:5432/${POSTGRES_DB:-real_estate_market}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Ho_Chi_Minh
    command: ["python", "-m", "src.scrapers.scheduler", "--mode", "${SCRAPER_MODE:-daemon}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../configs:/app/configs
      - ${HOST_DATA_ROOT:-../../data}:/app/data
      - ../../docs:/app/docs
      - ${HOST_LOGS_ROOT:-../../logs}:/app/logs
    networks:
      - propvalue_net

networks:
  propvalue_net:
    driver: bridge
